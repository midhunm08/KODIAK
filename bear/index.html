<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEAR</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <div class="bear">🐻</div>

    <h1>BEAR</h1>

    <p class="subtitle">Your day, remembered.</p>

    <div id="home">

      <h2>Good evening.</h2>

      <p>
        Let's look back at your day.
        You tell me what happened.
        I'll remember it.
      </p>

      <button id="newSave">✨ Start New Save</button>

      <button id="loadSave" class="secondary">
        📂 Load Existing Save
      </button>

      <input
        type="file"
        id="fileInput"
        accept=".json"
        hidden
      >

    </div>

  </div>

  <script src="bear.js"></script>

</body>
</html>
