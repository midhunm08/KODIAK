<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>KODIAK</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <section id="loginScreen" class="screen">

    <div class="auth-card">

      <div class="logo">K</div>

      <h1>KODIAK</h1>
      <p class="subtitle">Project Tracker</p>

      <div id="loginMessage" class="message"></div>

      <input
        id="loginUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button onclick="login()" class="primary-btn">
        Login
      </button>

      <button onclick="showRegister()" class="text-btn">
        Create new account
      </button>

    </div>

  </section>


  <!-- ================= REGISTER ================= -->

  <section id="registerScreen" class="screen hidden">

    <div class="auth-card">

      <div class="logo">K</div>

      <h1>Create account</h1>
      <p class="subtitle">Simple KODIAK account</p>

      <div id="registerMessage" class="message"></div>

      <input
        id="registerUsername"
        type="text"
        placeholder="Username"
      >

      <input
        id="registerDisplayName"
        type="text"
        placeholder="Display name"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
      >

      <button onclick="register()" class="primary-btn">
        Create account
      </button>

      <button onclick="showLogin()" class="text-btn">
        ← Back to login
      </button>

    </div>

  </section>


  <!-- ================= APP ================= -->

  <section id="appScreen" class="hidden">

    <header class="topbar">

      <div>
        <div class="brand">KODIAK</div>
        <div id="welcomeUser" class="welcome"></div>
      </div>

      <button onclick="logout()" class="logout-btn">
        Logout
      </button>

    </header>


    <main class="container">

      <div class="dashboard-head">

        <div>
          <h2>Projects</h2>
          <p>Your projects at a glance.</p>
        </div>

        <button onclick="openProjectModal()" class="primary-btn small">
          + New Project
        </button>

      </div>


      <div class="toolbar">

        <input
          id="searchBox"
          type="search"
          placeholder="Search projects..."
          oninput="renderProjects()"
        >

      </div>


      <div id="projectsList" class="projects-grid">

        <div class="empty-state">
          Loading projects...
        </div>

      </div>

    </main>

  </section>


  <!-- ================= PROJECT MODAL ================= -->

  <div id="projectModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-head">

        <h2>New Project</h2>

        <button onclick="closeProjectModal()" class="close-btn">
          ×
        </button>

      </div>

      <input
        id="projectName"
        type="text"
        placeholder="Project name"
      >

      <textarea
        id="projectDescription"
        placeholder="Description (optional)"
      ></textarea>

      <label>Project colour</label>

      <input
        id="projectColor"
        type="color"
        value="#7c3aed"
      >

      <button onclick="createProject()" class="primary-btn">
        Create Project
      </button>

    </div>

  </div>


  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
