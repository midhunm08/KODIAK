<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODIAK</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================== -->

    <div id="loginScreen" class="screen">

        <div class="login-box">

            <div class="logo">KODIAK</div>

            <p class="subtitle">Your personal command centre.</p>

            <input
                id="username"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginBtn" onclick="login()">
                Enter KODIAK
            </button>

            <button
                id="signupBtn"
                class="secondary-btn"
                onclick="signup()"
            >
                Create account
            </button>

            <p id="authMessage"></p>

        </div>

    </div>


    <!-- =========================
         APP
    ========================== -->

    <div id="appScreen" class="screen hidden">

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="brand">
                KODIAK
            </div>

            <div class="top-actions">

                <span id="welcomeUser"></span>

                <button onclick="logout()" class="logout-btn">
                    Logout
                </button>

            </div>

        </header>


        <!-- MAIN -->

        <main class="container">

            <!-- HOME -->

            <section id="homeView">

                <div class="hero">

                    <div>
                        <h1>Good to see you.</h1>
                        <p>
                            Everything you need, in one place.
                        </p>
                    </div>

                </div>


                <!-- QUICK STATUS -->

                <div class="status-grid">

                    <div class="status-card">
                        <span>Projects</span>
                        <strong id="projectCount">0</strong>
                    </div>

                    <div class="status-card">
                        <span>In Progress</span>
                        <strong id="progressCount">0</strong>
                    </div>

                    <div class="status-card">
                        <span>Issues</span>
                        <strong id="issueCount">0</strong>
                    </div>

                    <div class="status-card">
                        <span>Reminders</span>
                        <strong id="reminderCount">0</strong>
                    </div>

                </div>


                <!-- TOOLS -->

                <div class="section-header">

                    <div>
                        <h2>Tools</h2>
                        <p>Your KODIAK toolbox.</p>
                    </div>

                    <input
                        id="toolSearch"
                        type="search"
                        placeholder="Search tools..."
                        oninput="filterTools()"
                    >

                </div>


                <div id="toolsGrid" class="tools-grid">

                    <!-- Tools inserted by JavaScript -->

                </div>


                <!-- PROJECTS -->

                <div class="section-header project-header">

                    <div>
                        <h2>Projects</h2>
                        <p>Track everything you're working on.</p>
                    </div>

                    <button onclick="showNewProject()">
                        + New Project
                    </button>

                </div>


                <div id="projectsGrid" class="projects-grid">

                    <!-- Projects inserted by JavaScript -->

                </div>

            </section>


            <!-- PROJECT DETAIL -->

            <section id="projectView" class="hidden">

                <button
                    class="back-btn"
                    onclick="showHome()"
                >
                    ← Back
                </button>

                <div id="projectDetails">

                    <!-- Filled by JavaScript -->

                </div>

            </section>

        </main>

    </div>


    <!-- =========================
         NEW PROJECT MODAL
    ========================== -->

    <div id="projectModal" class="modal hidden">

        <div class="modal-box">

            <button
                class="close-btn"
                onclick="closeProjectModal()"
            >
                ×
            </button>

            <h2>New Project</h2>

            <input
                id="newProjectName"
                type="text"
                placeholder="Project name"
            >

            <textarea
                id="newProjectDescription"
                placeholder="Description (optional)"
            ></textarea>

            <label>Project colour</label>

            <input
                id="newProjectColour"
                type="color"
                value="#6366f1"
            >

            <button onclick="createProject()">
                Create Project
            </button>

            <p id="projectMessage"></p>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
